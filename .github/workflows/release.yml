name: Release binaries

# Fires when a GitHub release is published (e.g. `gh release create v0.5.0 …`),
# builds a static-ish binary per target, and attaches a tarball to the release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach binaries to (e.g. v0.5.0)
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Use bash on every runner (incl. Windows' Git Bash) so the packaging steps
    # are one script, not per-OS branches.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS targets build on Apple Silicon (macos-14): arm64 native,
          # x86_64 cross-compiled — the macOS SDK ships both arches, so this
          # avoids the scarce/deprecated Intel `macos-13` runner. Skipped
          # linux-aarch64 (needs a C cross-toolchain for bundled SQLite).
          - { os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu }
          - { os: macos-14,       target: aarch64-apple-darwin }
          - { os: macos-14,       target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        id: pkg
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          BIN=joule
          [ "${{ runner.os }}" = "Windows" ] && BIN=joule.exe
          NAME="joule-${TAG}-${{ matrix.target }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$NAME" "$BIN"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          gh release upload "$TAG" "${{ steps.pkg.outputs.name }}" --clobber
